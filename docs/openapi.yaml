openapi: 3.0.3
info:
  title: AutoZap — API pública
  version: 2.0.0
  description: >-
    Camada REST sobre a WhatsApp Cloud API oficial da Meta. A autenticação usa
    chaves internas da plataforma (sk_live_ / sk_test_), que NÃO são tokens da
    Meta — os tokens ficam criptografados no servidor. Chaves sk_test_ validam
    tudo mas não chamam a Meta (respostas com "test_mode": true).
    O formato dos objetos de mensagem segue a documentação oficial da Cloud API.
servers:
  - url: https://SUA-URL.onrender.com/api/v1
    description: Produção
  - url: http://localhost:5000/api/v1
    description: Desenvolvimento local
security:
  - bearerAuth: []
tags:
  - name: Conta
  - name: Números
  - name: Mensagens
  - name: Modelos e mídia
  - name: Conversas
  - name: Uso
paths:
  /me:
    get:
      tags: [Conta]
      summary: Organização, plano e chave usada
      operationId: getMe
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  organization:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      plan: { type: string, enum: [api, api_chat] }
                  key:
                    type: object
                    properties:
                      id: { type: string, format: uuid }
                      name: { type: string }
                      environment: { type: string, enum: [test, live] }
                      scopes: { type: array, items: { type: string } }
                  request_id: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }

  /channels:
    get:
      tags: [Números]
      summary: Lista os números ativos da organização
      description: "Escopo: channels:read"
      operationId: listChannels
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Channel" } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /channels/{phone_number_id}:
    get:
      tags: [Números]
      summary: Detalhes de um número
      description: "Escopo: channels:read"
      operationId: getChannel
      parameters: [{ $ref: "#/components/parameters/PhoneNumberId" }]
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Channel" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /whatsapp/{phone_number_id}/messages:
    post:
      tags: [Mensagens]
      summary: Envia uma mensagem
      description: >-
        Escopo messages:send. O corpo segue o objeto de mensagem da Cloud API, sem
        messaging_product. Mensagens livres só são entregues dentro da janela de 24h
        após a última mensagem do contato; fora dela, use type=template.
      operationId: sendMessage
      parameters:
        - { $ref: "#/components/parameters/PhoneNumberId" }
        - name: Idempotency-Key
          in: header
          required: false
          description: 8–128 caracteres. Repetições devolvem a resposta original (header Idempotent-Replayed).
          schema: { type: string, minLength: 8, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SendMessage" }
            examples:
              texto:
                value: { to: "5511999998888", type: text, text: { body: "Mensagem de teste" } }
              modelo:
                value:
                  to: "5511999998888"
                  type: template
                  template:
                    name: pedido_enviado
                    language: { code: pt_BR }
                    components: [{ type: body, parameters: [{ type: text, text: Ana }] }]
              imagem:
                value: { to: "5511999998888", type: image, image: { link: "https://exemplo.com/foto.jpg", caption: "Seu produto" } }
      responses:
        "201":
          description: Mensagem aceita pela Meta (ou registrada em modo de teste)
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    allOf:
                      - $ref: "#/components/schemas/Message"
                      - type: object
                        properties:
                          meta_response: { type: object, description: Resposta original da Meta }
                  test_mode: { type: boolean }
                  request_id: { type: string }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/RateLimited" }
        "502": { $ref: "#/components/responses/MetaError" }
        "504": { $ref: "#/components/responses/MetaError" }

  /whatsapp/{phone_number_id}/messages/read:
    post:
      tags: [Mensagens]
      summary: Marca uma mensagem recebida como lida (e, opcionalmente, mostra "digitando…")
      description: "Escopo: messages:send. Com typing=true o contato vê \"digitando…\" até a próxima resposta ou por até 25 s."
      operationId: markRead
      parameters: [{ $ref: "#/components/parameters/PhoneNumberId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message_id]
              properties:
                message_id: { type: string, example: "wamid.HBgM..." }
                typing: { type: boolean, default: false }
      responses:
        "200": { description: OK }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/MetaError" }

  /messages:
    get:
      tags: [Mensagens]
      summary: Lista mensagens (status de entrega)
      description: "Escopo: messages:read. content só é preenchido no plano api_chat."
      operationId: listMessages
      parameters:
        - { name: phone_number_id, in: query, schema: { type: string } }
        - { name: direction, in: query, schema: { type: string, enum: [inbound, outbound] } }
        - { name: contact, in: query, schema: { type: string }, description: Número do contato }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 100, default: 50 } }
        - { name: before, in: query, schema: { type: string, format: date-time }, description: Use next_before da página anterior }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Message" } }
                  next_before: { type: string, nullable: true }

  /messages/{message_id}:
    get:
      tags: [Mensagens]
      summary: Consulta uma mensagem pelo id interno ou wamid
      description: "Escopo: messages:read"
      operationId: getMessage
      parameters:
        - { name: message_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties: { data: { $ref: "#/components/schemas/Message" } }
        "404": { $ref: "#/components/responses/NotFound" }

  /whatsapp/{phone_number_id}/templates:
    get:
      tags: [Modelos e mídia]
      summary: Lista os modelos da WABA (consultados na Meta)
      description: "Escopo: templates:read"
      operationId: listTemplates
      parameters:
        - { $ref: "#/components/parameters/PhoneNumberId" }
        - { name: status, in: query, schema: { type: string, example: APPROVED } }
      responses:
        "200": { description: Lista no formato da Meta (name, status, language, category, components, rejected_reason) }
        "502": { $ref: "#/components/responses/MetaError" }
    post:
      tags: [Modelos e mídia]
      summary: Cria um modelo de mensagem (vai para análise da Meta)
      description: "Escopo: templates:write. Corpo no formato da Graph API."
      operationId: createTemplate
      parameters: [{ $ref: "#/components/parameters/PhoneNumberId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, language, category, components]
              properties:
                name: { type: string, pattern: "^[a-z0-9_]{1,512}$", example: lembrete_consulta }
                language: { type: string, example: pt_BR }
                category: { type: string, enum: [MARKETING, UTILITY, AUTHENTICATION] }
                components: { type: array, items: { type: object } }
                parameter_format: { type: string, enum: [POSITIONAL, NAMED] }
                allow_category_change: { type: boolean }
      responses:
        "201": { description: "{data: {id, status, category}}" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/MetaError" }

  /whatsapp/{phone_number_id}/templates/{name}:
    delete:
      tags: [Modelos e mídia]
      summary: Apaga um modelo (todas as línguas, ou só uma com hsm_id)
      description: "Escopo: templates:write"
      operationId: deleteTemplate
      parameters:
        - { $ref: "#/components/parameters/PhoneNumberId" }
        - { name: name, in: path, required: true, schema: { type: string } }
        - { name: hsm_id, in: query, schema: { type: string } }
      responses:
        "200": { description: "{data: {success: true}}" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/MetaError" }

  /whatsapp/{phone_number_id}/business_profile:
    get:
      tags: [Modelos e mídia]
      summary: Lê o perfil comercial do número
      description: "Escopo: channels:read. Resposta no formato da Meta: {data: [{about, address, description, email, profile_picture_url, websites, vertical}]}"
      operationId: getBusinessProfile
      parameters: [{ $ref: "#/components/parameters/PhoneNumberId" }]
      responses:
        "200": { description: Perfil no formato da Meta }
        "502": { $ref: "#/components/responses/MetaError" }
    post:
      tags: [Modelos e mídia]
      summary: Atualiza o perfil comercial do número
      description: "Escopo: profile:write. Envie só os campos que quer alterar."
      operationId: updateBusinessProfile
      parameters: [{ $ref: "#/components/parameters/PhoneNumberId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                about: { type: string, maxLength: 139 }
                address: { type: string, maxLength: 256 }
                description: { type: string, maxLength: 512 }
                email: { type: string, maxLength: 128 }
                websites: { type: array, maxItems: 2, items: { type: string, format: uri } }
                vertical: { type: string, example: HEALTH }
      responses:
        "200": { description: "{data: {success: true}}" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "502": { $ref: "#/components/responses/MetaError" }

  /whatsapp/{phone_number_id}/media:
    post:
      tags: [Modelos e mídia]
      summary: Envia um arquivo para a Meta e retorna o media id
      description: "Escopo: media:write"
      operationId: uploadMedia
      parameters: [{ $ref: "#/components/parameters/PhoneNumberId" }]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties: { file: { type: string, format: binary } }
      responses:
        "201":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: object, properties: { id: { type: string } } }
                  test_mode: { type: boolean }
        "400": { $ref: "#/components/responses/BadRequest" }

  /whatsapp/{phone_number_id}/media/{media_id}:
    get:
      tags: [Modelos e mídia]
      summary: Baixa uma mídia recebida (stream)
      description: "Escopo: media:read. O media_id chega no webhook message.received."
      operationId: downloadMedia
      parameters:
        - { $ref: "#/components/parameters/PhoneNumberId" }
        - { name: media_id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Conteúdo binário com o Content-Type original
          content:
            application/octet-stream:
              schema: { type: string, format: binary }
        "502": { $ref: "#/components/responses/MetaError" }

  /conversations:
    get:
      tags: [Conversas]
      summary: Lista conversas (plano api_chat)
      description: "Escopo: conversations:read"
      operationId: listConversations
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [open, resolved] } }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 200 } }
      responses:
        "200": { description: OK }
        "403": { $ref: "#/components/responses/Forbidden" }

  /conversations/{conversation_id}/messages:
    get:
      tags: [Conversas]
      summary: Mensagens de uma conversa (plano api_chat)
      description: "Escopo: conversations:read"
      operationId: conversationMessages
      parameters:
        - { name: conversation_id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200": { description: OK }
        "404": { $ref: "#/components/responses/NotFound" }

  /usage:
    get:
      tags: [Uso]
      summary: Contagens reais de requisições e mensagens
      description: "Escopo: usage:read"
      operationId: usage
      parameters:
        - { name: days, in: query, schema: { type: integer, minimum: 1, maximum: 90, default: 30 } }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      period_days: { type: integer }
                      api_requests: { type: integer }
                      api_requests_24h: { type: integer }
                      messages_sent: { type: integer }
                      messages_received: { type: integer }
                      messages_failed: { type: integer }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: "Chave interna: Authorization: Bearer sk_live_... (ou sk_test_...)"
  parameters:
    PhoneNumberId:
      name: phone_number_id
      in: path
      required: true
      description: Phone Number ID da Meta de um número conectado à sua organização
      schema: { type: string, pattern: "^[0-9]{5,25}$" }
  schemas:
    Channel:
      type: object
      properties:
        id: { type: string, format: uuid }
        channel: { type: string, enum: [whatsapp] }
        connection_type: { type: string, enum: [embedded_signup, coexistence, manual] }
        waba_id: { type: string }
        phone_number_id: { type: string }
        display_phone_number: { type: string }
        verified_name: { type: string }
        quality_rating: { type: string, nullable: true }
        status: { type: string, enum: [pending, active, error] }
        webhook_subscribed: { type: boolean }
        connected_at: { type: string, format: date-time }
    SendMessage:
      type: object
      required: [to, type]
      properties:
        to: { type: string, description: "Número com código do país e DDD (8–15 dígitos)", example: "5511999998888" }
        type:
          type: string
          enum: [text, template, image, video, audio, document, sticker, location, interactive, reaction, contacts]
        text:
          type: object
          properties:
            body: { type: string, maxLength: 4096 }
            preview_url: { type: boolean }
        template:
          type: object
          properties:
            name: { type: string }
            language: { type: object, properties: { code: { type: string, example: pt_BR } } }
            components: { type: array, items: { type: object } }
        image: { $ref: "#/components/schemas/Media" }
        video: { $ref: "#/components/schemas/Media" }
        audio: { $ref: "#/components/schemas/Media" }
        document: { $ref: "#/components/schemas/Media" }
        sticker: { $ref: "#/components/schemas/Media" }
        location:
          type: object
          properties:
            latitude: { type: number }
            longitude: { type: number }
            name: { type: string }
            address: { type: string }
        interactive: { type: object, description: Objeto interactive da Cloud API (type + action) }
        reaction:
          type: object
          properties:
            message_id: { type: string }
            emoji: { type: string }
        contacts: { type: array, items: { type: object } }
        context:
          type: object
          properties: { message_id: { type: string, description: wamid da mensagem citada } }
        biz_opaque_callback_data: { type: string, maxLength: 512 }
    Media:
      type: object
      description: Informe exatamente um entre id e link (HTTPS)
      properties:
        id: { type: string }
        link: { type: string, format: uri }
        caption: { type: string }
        filename: { type: string }
    Message:
      type: object
      properties:
        id: { type: string, format: uuid }
        connection_id: { type: string, format: uuid }
        conversation_id: { type: string, format: uuid, nullable: true }
        direction: { type: string, enum: [inbound, outbound] }
        wamid: { type: string, nullable: true }
        contact_wa_id: { type: string }
        type: { type: string }
        content: { type: object, nullable: true }
        status: { type: string, enum: [received, accepted, sent, delivered, read, failed, test] }
        error: { type: object, nullable: true }
        source: { type: string, enum: [api, dashboard, webhook] }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    Error:
      type: object
      properties:
        error:
          type: object
          properties:
            code: { type: string }
            message: { type: string }
            request_id: { type: string }
            field: { type: string }
            meta_error:
              type: object
              description: Erro original da Meta (code, error_subcode, type, details, fbtrace_id)
  responses:
    BadRequest:
      description: Entrada inválida
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Unauthorized:
      description: Chave ausente, inválida, expirada ou revogada
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Forbidden:
      description: Escopo ou plano insuficiente
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    NotFound:
      description: Recurso inexistente nesta organização
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    Conflict:
      description: Idempotency-Key em uso ou número sem credencial válida
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    RateLimited:
      description: Limite por chave (desta API) ou limite da Meta
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
    MetaError:
      description: A Meta recusou (502) ou não respondeu a tempo (504)
      content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } }
