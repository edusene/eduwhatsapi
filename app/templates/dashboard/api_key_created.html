{% extends "base.html" %}
{% block title %}Chave criada — MetaBridge{% endblock %}
{% block content %}
<div class="centered-card secret-card">
  <h1>Chave criada</h1>
  <div class="alert alert-warning">
    Copie a chave agora. Você não poderá vê-la novamente.
  </div>
  <div class="secret-box">
    <code id="secret">{{ key.key }}</code>
    <button type="button" class="btn btn-sm" data-clipboard-target="#secret">Copiar</button>
  </div>
  <p><strong>Nome:</strong> {{ key.name }}<br><strong>Ambiente:</strong> {{ key.environment }}</p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.api_keys_list') }}">Concluir</a>
</div>
{% endblock %}
