{% extends "base.html" %}
{% block title %}Chave criada — MetaBridge{% endblock %}
{% block content %}
<div class="page-header">
  <h1>Chave criada com sucesso</h1>
</div>
<div class="card">
  <div class="alert alert-warning">
    <strong>Importante:</strong> Copie a chave agora. Você não poderá vê-la novamente.
  </div>
  <div class="secret-box">
    <code id="secret">{{ key.key }}</code>
    <button type="button" class="btn btn-sm" data-clipboard-target="#secret">Copiar</button>
  </div>
  <p style="color:var(--fg-muted); margin-bottom:20px;">
    <strong>Nome:</strong> {{ key.name }}<br>
    <strong>Ambiente:</strong> {{ key.environment }}
  </p>
  <a class="btn btn-primary" href="{{ url_for('dashboard.api_keys_list') }}">Concluir</a>
</div>
{% endblock %}
