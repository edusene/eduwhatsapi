{% extends "layouts/auth.html" %}
{% block title %}Entrar — {{ app_name }}{% endblock %}
{% block content %}
<h1>Bem-vindo de volta</h1>
<p class="sub">Entre para gerenciar seus números, chaves e conversas.</p>
<form method="post" action="{{ url_for('auth.login_post') }}" data-loading>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.args.get('next', '') }}">
  <div class="field">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" value="{{ email or '' }}" required autocomplete="email" autofocus placeholder="voce@empresa.com">
  </div>
  <div class="field">
    <div class="row-between"><label for="password" class="label">Senha</label><a class="small" href="{{ url_for('auth.forgot_password') }}">Esqueceu a senha?</a></div>
    <input type="password" id="password" name="password" required autocomplete="current-password">
  </div>
  <button type="submit" class="btn btn-primary btn-block btn-lg">Entrar</button>
</form>
<p class="mt-3 muted">Ainda não tem conta? <a href="{{ url_for('auth.register') }}">Criar conta</a></p>
{% endblock %}
