{% extends "base.html" %}
{% block title %}Entrar — AutoZap{% endblock %}
{% block auth_content %}
<h2 class="auth-title">Entrar na sua conta</h2>
<form method="post" action="{{ url_for('auth.login') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
  <div class="form-group">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus placeholder="seu@email.com">
  </div>
  <div class="form-group">
    <label for="password">Senha</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" minlength="10" placeholder="••••••••••">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Entrar</button>
</form>
<div class="form-links">
  <a href="{{ url_for('auth.forgot_password') }}">Esqueceu a senha?</a>
  <span class="divider">•</span>
  <a href="{{ url_for('auth.register') }}">Criar conta</a>
</div>
{% endblock %}
