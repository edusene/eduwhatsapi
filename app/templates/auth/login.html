{% extends "base.html" %}
{% block title %}Entrar — MetaBridge{% endblock %}
{% block content %}
<div class="centered-card">
  <h1>Entrar</h1>
  <form method="post" action="{{ url_for('auth.login') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="next" value="{{ request.args.get('next','') }}">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus>
    <label for="password">Senha</label>
    <input type="password" id="password" name="password" required autocomplete="current-password" minlength="10">
    <button type="submit" class="btn btn-primary">Entrar</button>
    <div class="form-links">
      <a href="{{ url_for('auth.register') }}">Criar conta</a>
      <a href="{{ url_for('auth.forgot_password') }}">Esqueceu a senha?</a>
    </div>
  </form>
</div>
{% endblock %}
