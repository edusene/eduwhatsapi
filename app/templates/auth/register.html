{% extends "base.html" %}
{% block title %}Criar conta — MetaBridge{% endblock %}
{% block content %}
<div class="centered-card">
  <h1>Criar conta</h1>
  <form method="post" action="{{ url_for('auth.register') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus>
    <label for="password">Senha (mín. 10 caracteres)</label>
    <input type="password" id="password" name="password" required autocomplete="new-password" minlength="10">
    <label for="org_name">Nome da organização</label>
    <input type="text" id="org_name" name="org_name" required maxlength="120">
    <button type="submit" class="btn btn-primary">Criar conta</button>
    <div class="form-links">
      <a href="{{ url_for('auth.login') }}">Já tem uma conta? Entrar</a>
    </div>
  </form>
</div>
{% endblock %}
