{% extends "base.html" %}
{% block title %}Nova senha — MetaBridge{% endblock %}
{% block auth_content %}
<h2 class="auth-title">Definir nova senha</h2>
<form method="post" action="{{ url_for('auth.reset_password') }}" id="resetForm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <input type="hidden" name="access_token" id="access_token">
  <div class="form-group">
    <label for="new_password">Nova senha</label>
    <input type="password" id="new_password" name="new_password" required minlength="10" placeholder="Mínimo 10 caracteres">
  </div>
  <div class="form-group">
    <label for="confirm_password">Confirmar senha</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="10" placeholder="Repita a senha">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Salvar senha</button>
</form>
<div class="form-links">
  <a href="{{ url_for('auth.login') }}">Voltar ao login</a>
</div>
<noscript>
  <div class="alert alert-error">Este formulário requer JavaScript para preencher o token de recuperação.</div>
</noscript>
{% endblock %}
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/reset-password.js') }}" defer></script>
{% endblock %}
