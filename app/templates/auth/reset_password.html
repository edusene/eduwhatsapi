{% extends "base.html" %}
{% block title %}Nova senha — MetaBridge{% endblock %}
{% block content %}
<div class="centered-card">
  <h1>Definir nova senha</h1>
  <form method="post" action="{{ url_for('auth.reset_password') }}" class="form" id="resetForm">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <input type="hidden" name="access_token" id="access_token">
    <label for="new_password">Nova senha (mín. 10)</label>
    <input type="password" id="new_password" name="new_password" required minlength="10">
    <label for="confirm_password">Confirmar senha</label>
    <input type="password" id="confirm_password" name="confirm_password" required minlength="10">
    <button type="submit" class="btn btn-primary">Salvar senha</button>
  </form>
  <noscript>
    <p class="alert alert-error">Este formulário requer JavaScript para preencher o token de recuperação.</p>
  </noscript>
</div>
{% block extra_scripts %}
<script src="{{ url_for('static', filename='js/reset-password.js') }}" defer></script>
{% endblock %}
{% endblock %}
