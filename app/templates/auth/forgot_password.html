{% extends "layouts/auth.html" %}
{% block title %}Recuperar senha — {{ app_name }}{% endblock %}
{% block content %}
<h1>Recuperar senha</h1>
<p class="sub">Informe o e-mail da sua conta. Enviaremos um link para criar uma nova senha.</p>
<form method="post" action="{{ url_for('auth.forgot_password_post') }}" data-loading>
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="field">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus placeholder="voce@empresa.com">
  </div>
  <button type="submit" class="btn btn-primary btn-block btn-lg">Enviar link</button>
</form>
<p class="mt-3"><a href="{{ url_for('auth.login') }}">← Voltar para o login</a></p>
{% endblock %}
