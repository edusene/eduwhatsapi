{% extends "base.html" %}
{% block title %}Recuperar senha — MetaBridge{% endblock %}
{% block auth_content %}
<h2 class="auth-title">Recuperar senha</h2>
<form method="post" action="{{ url_for('auth.forgot_password') }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus placeholder="seu@email.com">
  </div>
  <button type="submit" class="btn btn-primary btn-block">Enviar instruções</button>
</form>
<div class="form-links">
  <a href="{{ url_for('auth.login') }}">Voltar ao login</a>
</div>
{% endblock %}
