{% extends "base.html" %}
{% block title %}Recuperar senha — MetaBridge{% endblock %}
{% block content %}
<div class="centered-card">
  <h1>Recuperar senha</h1>
  <form method="post" action="{{ url_for('auth.forgot_password') }}" class="form">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">E-mail</label>
    <input type="email" id="email" name="email" required autocomplete="email" autofocus>
    <button type="submit" class="btn btn-primary">Enviar instruções</button>
    <div class="form-links">
      <a href="{{ url_for('auth.login') }}">Voltar ao login</a>
    </div>
  </form>
</div>
{% endblock %}
