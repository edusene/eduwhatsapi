# Blueprint do Render — provisiona o Web Service. Sem segredos aqui:
# variáveis com "sync: false" devem ser preenchidas no painel do Render
# (Environment > Environment Variables). Veja docs/deployment-render.md.
services:
  - type: web
    name: autozap
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app --workers 2 --threads 4 --timeout 120 --access-logfile - --error-logfile -
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: SESSION_COOKIE_SECURE
        value: "true"
      - key: LOG_LEVEL
        value: INFO
      - key: APP_BASE_URL
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: SECRET_KEY
        generateValue: true
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: META_APP_ID
        sync: false
      - key: META_APP_SECRET
        sync: false
      - key: META_GRAPH_API_VERSION
        value: v26.0
      - key: META_ES_CONFIG_ID
        sync: false
      - key: META_WEBHOOK_VERIFY_TOKEN
        generateValue: true
      - key: META_WEBHOOK_APP_SECRET
        sync: false
      - key: TOKEN_ENCRYPTION_KEY
        sync: false   # precisa ser uma chave Fernet (veja .env.example); generateValue não serve
      - key: API_KEY_PEPPER
        generateValue: true
      - key: CRON_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: RATE_LIMIT_STORAGE_URI
        value: memory://
      - key: BACKGROUND_WORKER_ENABLED
        value: "true"
      - key: OUTBOUND_WEBHOOK_ALLOW_INSECURE
        value: "false"
